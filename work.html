    <style>
        /* Hiệu ứng thẻ kính và hover */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px -12px rgba(54, 103, 88, 0.04);
        }

        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px -20px rgba(54, 103, 88, 0.08);
        }

        /* Style cho nút filter đang được chọn */
        .filter-chip.active {
            background-color: #366758; /* Màu primary */
            color: #ffffff;
        }

        .filter-chip {
            display: flex;
            width: 100%;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.34);
        }

        .filter-checkbox {
            display: inline-flex;
            width: 18px;
            height: 18px;
            flex: 0 0 18px;
            align-items: center;
            justify-content: center;
            border: 1.5px solid rgba(54, 103, 88, 0.65);
            border-radius: 5px;
        }

        .filter-chip.active .filter-checkbox {
            border-color: #ffffff;
            background: #ffffff;
        }

        .filter-chip.active .filter-checkbox::after {
            content: '';
            width: 8px;
            height: 4px;
            margin-top: -2px;
            border-bottom: 2px solid #366758;
            border-left: 2px solid #366758;
            transform: rotate(-45deg);
        }

        /* Tùy chỉnh layout cho hàng illustration */
        #projects-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 2rem;
        }

        .project-group { display: contents; }

        @media (min-width: 768px) {
            #projects-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1024px) {
            #projects-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

    </style>

    <!-- Script xử lý chức năng Filter -->
    <script>
        // ─── Service Worker Registration ──────────────────────────────────────────
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch((err) => console.warn('SW registration failed:', err));
            });
        }

        const activeFilters = new Set(['product', 'illustration']);

        function updateFilterButton(button, isActive) {
            button.classList.toggle('active', isActive);
            button.classList.toggle('text-white', isActive);
            button.classList.toggle('text-text-dark', !isActive);
            button.classList.toggle('hover:bg-gray-100', !isActive);
            button.setAttribute('aria-pressed', String(isActive));
            button.querySelector('.filter-chip-label').textContent = button.dataset.label;
        }

        function filterProjects(category) {
            const items = document.querySelectorAll('.project-item');
            const buttons = document.querySelectorAll('.filter-chip');
            
            // Cập nhật trạng thái nút (Active)
            if (category === 'all') {
                activeFilters.clear();
                activeFilters.add('product');
                activeFilters.add('illustration');
            } else if (activeFilters.has(category)) {
                activeFilters.delete(category);
            } else {
                activeFilters.add(category);
            }

            buttons.forEach(button => {
                const buttonFilter = button.dataset.filter;
                updateFilterButton(button, activeFilters.has(buttonFilter));
            });

            // Lọc các dự án với hiệu ứng fade
            items.forEach(item => {
                if (activeFilters.size === 0 || Array.from(activeFilters).some(filter => item.classList.contains(filter))) {
                    item.style.display = 'block';
                    setTimeout(() => {
                        item.style.opacity = '1';
                        item.style.transform = 'scale(1)';
                    }, 50);
                } else {
                    item.style.opacity = '0';
                    item.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        item.style.display = 'none';
                    }, 300);
                }
            });

        }

        // Khởi tạo hiệu ứng mặc định khi load trang
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('.project-item');
            items.forEach(item => {
                item.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            });
            const filterMenuButton = document.getElementById('filter-menu-button');
            const filterMenu = document.getElementById('filter-menu');
            document.querySelectorAll('.filter-chip').forEach(button => {
                button.addEventListener('click', () => filterProjects(button.dataset.filter));
            });
            document.querySelectorAll('.filter-chip').forEach(button => {
                updateFilterButton(button, activeFilters.has(button.dataset.filter));
            });
            filterMenuButton.addEventListener('click', () => {
                const isOpen = filterMenu.classList.toggle('hidden') === false;
                filterMenuButton.setAttribute('aria-expanded', String(isOpen));
            });
            document.addEventListener('click', event => {
                if (!filterMenu.contains(event.target) && !filterMenuButton.contains(event.target)) {
                    filterMenu.classList.add('hidden');
                    filterMenuButton.setAttribute('aria-expanded', 'false');
                }
            });
        });
    </script>
