<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Works | Nguyen Thao</title>
    
    <!-- Nhúng Font Afacad và Big Shoulders Display -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&family=Big+Shoulders+Display:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Nhúng Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#366758",
                        "secondary": "#593d5f",
                        "background-color": "#E9EDED",
                        "text-dark": "#000000",
                        "text-body": "#1A1A1A",
                        "lavender": "#E0BBE4",
                        "mint": "#B5EAD7",
                        "baby-blue": "#C7CEEA",
                        "peach": "#FFDAC1",
                        "on-primary": "#ffffff"
                    },
                    fontFamily: {
                        "display": ["'Big Shoulders Display'", "sans-serif"],
                        "body": ["'Afacad'", "sans-serif"]
                    }
                }
            }
        }
    </script>

    <style>
        /* Hiệu ứng thẻ kính và hover */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 30px 60px -12px rgba(54, 103, 88, 0.04);
        }

        .hover-lift {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
        }
        
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 80px -20px rgba(54, 103, 88, 0.08);
        }

        /* Style cho nút filter đang được chọn */
        .filter-btn.active {
            background-color: #366758; /* Màu primary */
            color: #ffffff;
        }

        /* Tùy chỉnh layout cho hàng illustration */
        #projects-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 2rem;
        }

        .project-group { display: contents; }

        @media (min-width: 768px) {
            #projects-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (min-width: 1024px) {
            #projects-grid {
                grid-template-columns: repeat(3, minmax(0, 1fr));
            }
        }

    </style>
</head>
<body class="font-body text-text-body bg-background-color antialiased overflow-x-hidden selection:bg-mint selection:text-primary">

    <!-- TopNavBar -->
    <header class="w-full min-h-[80px] pt-6 pb-4 z-50 bg-white shadow-sm flex items-center">
        <nav class="flex justify-between items-center w-full px-6 md:px-24 max-w-[1440px] mx-auto">
            <a href="index.html" class="text-[25px] leading-none font-display font-black text-text-dark tracking-[-0.4px] hover:opacity-80 transition-opacity">
                NguyenThao
            </a>
            <div class="hidden md:flex items-center gap-12">
                <a class="text-text-dark hover:text-primary transition-colors text-xl leading-7 font-medium border-b-2 border-transparent" href="index.html">Home</a>
                <!-- Mục Works đang được Active -->
                <a class="text-primary font-bold border-b-2 border-primary text-xl leading-7" href="work.html">Works</a>
                <a class="text-text-dark hover:text-primary transition-colors text-xl leading-7 font-medium border-b-2 border-transparent" href="about.html">About</a>
            </div>
        </nav>
    </header>

    <main class="min-h-[85vh]">
        <!-- Projects Section -->
        <section class="py-16 px-6 md:px-24 max-w-[1440px] mx-auto" id="works">
            
            <!-- Filter Controls -->
            <div class="flex flex-wrap items-center justify-between gap-6 mb-12">
                <h2 class="font-display text-4xl md:text-[48px] font-extrabold text-text-dark tracking-tight">Selected Works</h2>
                <div class="flex items-center p-1.5 bg-white rounded-full shadow-sm space-x-1 border border-white/50">
                    <button class="filter-btn active px-6 py-2 rounded-full font-body font-bold text-lg transition-all duration-300" onclick="filterProjects('all')">All</button>
                    <button class="filter-btn px-6 py-2 rounded-full font-body font-bold text-lg text-text-dark transition-all duration-300 hover:bg-gray-100" onclick="filterProjects('product')">Product</button>
                    <button class="filter-btn px-6 py-2 rounded-full font-body font-bold text-lg text-text-dark transition-all duration-300 hover:bg-gray-100" onclick="filterProjects('illustration')">Illustration</button>
                </div>
            </div>

            <!-- Projects Grid -->
            <div id="projects-grid">
                
                <!-- Hàng trên: 2 Dự án (0.svg và 1.svg) -->
                <div class="project-group">
                    <!-- Hình 0 -->
                    <a class="project-item product group cursor-pointer" href="Doc/MoodFlow/index.html?from=works">
                        <img src="Folder/MoodFlow.svg" alt="MoodFlow project" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </a>
                    <!-- Hình 1 -->
                    <a class="project-item product group cursor-pointer" href="Doc/HomeStay Dorm/index.html?from=works">
                        <img src="Folder/HomeStay Dorm.svg" alt="HomeStay Dorm project" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </a>
                </div>

                <!-- Hàng dưới: 4 Dự án (2.svg đến 5.svg) -->
                <div class="project-group">
                    <!-- Hình 2 -->
                    <a class="project-item illustration group cursor-pointer" href="Doc/2027 Calender/index.html?from=works">
                        <img src="Folder/2027 Calender.svg" alt="2027 Calender project" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </a>
                    <!-- Hình 3 -->
                    <a class="project-item illustration group cursor-pointer" href="Doc/2026 Calender/index.html?from=works">
                        <img src="Folder/2026 Calender.svg" alt="2026 Calender project" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </a>
                    <!-- Hình 4 -->
                    <a class="project-item illustration group cursor-pointer" href="Doc/Treasure/2.html?from=works">
                        <img src="Folder/Treasure.svg" alt="Treasure project" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </a>
                    <!-- Hình 5 -->
                    <a class="project-item illustration group cursor-pointer" href="Doc/The Red Scarf/3.html?from=works">
                        <img src="Folder/The Red Scarf.svg" alt="The Red Scarf project" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105">
                    </a>
                </div>

            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="bg-primary text-white mt-12">
        <div class="max-w-[1440px] mx-auto px-6 md:px-24 py-8 text-center">
            <p class="font-body text-sm opacity-90">© 2026 Nguyên Thảo. Crafted with curiosity and creativity.</p>
        </div>
    </footer>

    <!-- Script xử lý chức năng Filter -->
    <script>
        // ─── Service Worker Registration ──────────────────────────────────────────
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .catch((err) => console.warn('SW registration failed:', err));
            });
        }

        function filterProjects(category) {
            const items = document.querySelectorAll('.project-item');
            const buttons = document.querySelectorAll('.filter-btn');
            
            // Cập nhật trạng thái nút (Active)
            buttons.forEach(btn => {
                btn.classList.remove('active', 'text-white');
                btn.classList.add('text-text-dark', 'hover:bg-gray-100');
                
                if((category === 'all' && btn.innerText === 'All') || 
                   (category === 'product' && btn.innerText === 'Product') || 
                   (category === 'illustration' && btn.innerText === 'Illustration')) {
                    btn.classList.add('active', 'text-white');
                    btn.classList.remove('text-text-dark', 'hover:bg-gray-100');
                }
            });

            // Lọc các dự án với hiệu ứng fade
            items.forEach(item => {
                if (category === 'all' || item.classList.contains(category)) {
                    item.style.display = 'block';
                    setTimeout(() => {
                        item.style.opacity = '1';
                        item.style.transform = 'scale(1)';
                    }, 50);
                } else {
                    item.style.opacity = '0';
                    item.style.transform = 'scale(0.95)';
                    setTimeout(() => {
                        item.style.display = 'none';
                    }, 300);
                }
            });

        }

        // Khởi tạo hiệu ứng mặc định khi load trang
        document.addEventListener('DOMContentLoaded', () => {
            const items = document.querySelectorAll('.project-item');
            items.forEach(item => {
                item.style.transition = 'all 0.4s cubic-bezier(0.4, 0, 0.2, 1)';
            });
        });
    </script>
</body>
</html>
