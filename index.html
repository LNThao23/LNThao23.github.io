<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    
    <!-- Nhúng Font Afacad và Big Shoulders Display -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
    <link href="https://fonts.googleapis.com/css2?family=Afacad:wght@400;500;600;700&family=Big+Shoulders+Display:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Nhúng Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        "primary": "#366758",
                        "secondary": "#593d5f",
                        "background-color": "#f8f9fa",
                        "text-dark": "#000000",
                        "text-body": "#1A1A1A",
                    },
                    fontFamily: {
                        "display": ["'Big Shoulders Display'", "sans-serif"],
                        "body": ["'Afacad'", "sans-serif"]
                    }
                }
            }
        }
    </script>
</head>
<body class="font-body text-text-body antialiased overflow-x-hidden">

    <!-- TopNavBar -->
    <header class="w-full min-h-[80px] pt-6 pb-4 z-50 bg-white flex items-center">
        <nav class="flex justify-between items-center w-full px-6 md:px-24 max-w-[1440px] mx-auto">
            <a href="index.html" class="text-[25px] leading-none font-display font-black text-text-dark tracking-[-0.4px] hover:opacity-80 transition-opacity">
                NguyenThao
            </a>
            <div class="hidden md:flex items-center gap-12">
                <a class="text-primary font-bold border-b-2 border-primary text-xl leading-7" href="index.html">Home</a>
                <a class="text-text-dark hover:text-primary transition-colors text-xl leading-7 font-medium border-b-2 border-transparent" href="work.html">Works</a>
                <a class="text-text-dark hover:text-primary transition-colors text-xl leading-7 font-medium border-b-2 border-transparent" href="about.html">About</a>
            </div>
        </nav>
    </header>

    <main class="bg-[#E9EDED]">
        <!-- Hero Section -->
        <section class="relative min-h-[85vh] flex items-center px-6 md:px-24 max-w-[1440px] mx-auto overflow-hidden pt-6">
            
            <div class="grid md:grid-cols-12 gap-8 items-center w-full z-10">
                
                <!-- Cột chữ (Bên trái) - Đã thu nhỏ các size chữ -->
                <div class="md:col-span-5 space-y-8">
                    <div class="space-y-4">
                        <!-- Tiêu đề nhỏ lại (60px) -->
                        <h1 class="font-display text-5xl md:text-[60px] font-extrabold leading-[1.05] text-text-dark tracking-tight">
                            Hi, I'm Nguyên Thảo.
                        </h1>
                        <!-- Mô tả nhỏ lại (20px) -->
                        <p class="font-body text-xl text-text-body leading-snug font-medium">
                            I design thoughtful digital experiences and bring stories to life through illustration.
                        </p>
                    </div>
                    
                    <div class="space-y-5">
                        <!-- Tên dự án nhỏ lại (24px) -->
                        <h3 id="project-title" class="font-display text-[24px] font-extrabold text-text-dark tracking-tight transition-opacity duration-500">
                            HomeStay Dorm - Website
                        </h3>
                        
                        <div class="inline-block">
                            <!-- Nút bấm - Size chữ nhỏ lại (16px), đệm lề nhỏ lại 1 chút -->
                            <div class="flex gap-4">
                                <button id="view-project-btn" class="bg-primary border-2 border-primary text-white font-body font-bold text-base px-7 py-2 rounded-full hover:bg-opacity-90 transition-all">
                                    View Project
                                </button>
                                <a href="about.html" class="border-[1.5px] border-secondary bg-transparent text-secondary font-body font-bold text-base px-9 py-2 rounded-full hover:bg-secondary hover:text-white transition-all inline-flex items-center justify-center">
                                    About Me
                                </a>
                            </div>
                            
                            <!-- Dấu chấm Slider -->
                            <div class="flex justify-center gap-2.5 pt-5 w-full">
                                <span class="w-2.5 h-2.5 rounded-full bg-primary"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-[#D9D9D9]"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-[#D9D9D9]"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-[#D9D9D9]"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-[#D9D9D9]"></span>
                                <span class="w-2.5 h-2.5 rounded-full bg-[#D9D9D9]"></span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Cột hình (Bên phải) - Đã xóa thẻ div tạo hiệu ứng sáng mờ -->
                <div class="md:col-span-7 relative flex justify-end items-center h-full">
                    <!-- Hình ảnh Cover -->
                    <img alt="HomeStay Dorm Website Project" class="w-full h-auto object-contain z-10 scale-100 origin-right transition-opacity duration-700" src="Cover/HomeStay Dorm.svg">
                </div>
                
            </div>
        </section>
    </main>

    <script>
        (function(){
            const img = document.querySelector('img[alt="HomeStay Dorm Website Project"]');
            const projectTitle = document.getElementById('project-title');
            const projectTitles = [
                'MoodFlow - Mobile App',
                'HomeStay Dorm - Website',
                '2027 Calender',
                '2026 Calender',
                'Treasure - Children\'s Book',
                'The Red Scarf - Children\'s Book'
            ];
            const projectSlugs = [
                'MoodFlow',
                'HomeStay Dorm',
                '2027 Calender',
                '2026 Calender',
                'Treasure',
                'The Red Scarf'
            ];
            const dots = Array.from(document.querySelectorAll('.flex.justify-center span'));
            const total = dots.length;
            let idx = 0;
            let autoSlide = null;

            function setActive(i){
                dots.forEach((d, j)=>{
                    if(j===i){
                        d.classList.remove('bg-[#D9D9D9]');
                        d.classList.add('bg-primary');
                    } else {
                        d.classList.remove('bg-primary');
                        d.classList.add('bg-[#D9D9D9]');
                    }
                });

                if(projectTitle){
                    projectTitle.classList.add('opacity-0');
                    setTimeout(() => {
                        projectTitle.textContent = projectTitles[i] || projectTitles[0];
                        projectTitle.classList.remove('opacity-0');
                    }, 250);
                }

                const targetSrc = `Cover/${projectSlugs[i]}.svg`;
                if(img.src.endsWith(targetSrc)){
                    return;
                }

                img.classList.add('opacity-0');
                img.onload = () => {
                    img.classList.remove('opacity-0');
                };
                img.src = targetSrc;
            }

            const projectFiles = [
                'Doc/MoodFlow/index.html?from=home',
                'Doc/HomeStay Dorm/index.html?from=home',
                'Doc/2027 Calender/index.html?from=home',
                'Doc/2026 Calender/index.html?from=home',
                'Doc/Treasure/index.html?from=home',
                'Doc/The Red Scarf/index.html?from=home'
            ];

            function openProject(){
                window.location.href = projectFiles[idx];
            }

            function resetAutoSlide(){
                if(autoSlide){
                    clearInterval(autoSlide);
                }
                autoSlide = setInterval(()=>{
                    idx = (idx + 1) % total;
                    setActive(idx);
                }, 5000);
            }

            dots.forEach((dot, index)=>{
                dot.classList.add('cursor-pointer');
                dot.addEventListener('click', ()=>{
                    idx = index;
                    setActive(idx);
                    resetAutoSlide();
                });
            });

            const viewProjectBtn = document.getElementById('view-project-btn');
            if(viewProjectBtn){
                viewProjectBtn.addEventListener('click', openProject);
            }

            if(img){
                img.classList.add('cursor-pointer');
                img.addEventListener('click', openProject);
            }

            setActive(idx);
            resetAutoSlide();
        })();
    </script>

</body>
</html>
